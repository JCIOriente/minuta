name: release

# Publishes a release in one approved job, in this order: @jcioriente/minuta and its four
# platform packages to npm (trusted publishing, OIDC, no stored token), then the minuta crate to
# crates.io (CARGO_REGISTRY_TOKEN, a secret of the `publish-packages` environment), then the
# GitHub release in a last job that needs no approval of its own.
# Pushing a tag v<X.Y.Z> that matches Cargo.toml publishes for real; every step skips what is
# already published, so a rerun after a partial failure completes the rest.
# workflow_dispatch builds everything and runs `npm publish --dry-run` and
# `cargo publish --dry-run --locked` (the default), and creates no release.
# Nothing is published from a branch or a pull request.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but only run the npm and cargo publish dry runs
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag must be the Cargo.toml version, so no package is published under a wrong version.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the ancestry check below needs main's history
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p;}' Cargo.toml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version '$version' is not X.Y.Z"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          # A release is cut from main: a tag on an unreviewed branch must not publish.
          if [ "$REF_TYPE" = tag ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tagged commit $GITHUB_SHA is not on main"
              exit 1
            fi
          fi
          # A real publish needs a tag; a branch run is always a dry run.
          dry_run=false
          if [ "$REF_TYPE" != tag ]; then
            dry_run=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN_INPUT" = true ]; then
            dry_run=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
      # The release notes come from CHANGELOG.md; fail now, not after the packages are published.
      - name: Check the changelog has this version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > /dev/null

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      # The toolchain installed with the target above; rust-toolchain.toml would select a fresh one.
      RUSTUP_TOOLCHAIN: stable
      # The runner's own musl-gcc builds `ring` for the musl target; the cc crate would otherwise
      # look for a cross compiler named after the target.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-gcc
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      # The Linux binaries must be static, or they would not run on every distribution.
      - name: Check the Linux binary is static
        if: endsWith(matrix.target, '-musl')
        run: |
          info=$(file "target/$TARGET/release/minuta")
          echo "$info"
          grep -qE 'statically linked|static-pie linked' <<< "$info"
      # x86_64-apple-darwin is built on an arm64 runner and not run here.
      - name: Run the binary
        if: matrix.target != 'x86_64-apple-darwin'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          got=$("target/$TARGET/release/minuta" --version)
          echo "$got"
          [ "$got" = "minuta $VERSION" ]
      - uses: actions/upload-artifact@v7
        with:
          name: minuta-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/minuta
          if-no-files-found: error

  # The four platform packages first and the main package last, so the main package never
  # points at a version that is not on the registry yet. The crate follows only once every npm
  # package is published (crates.io cannot unpublish, npm can deprecate).
  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The required-reviewer rule and the CARGO_REGISTRY_TOKEN secret live here. The name must match
    # the environment in each package's npm trusted publisher (renamed from npm-publish, #345).
    environment: publish-packages
    env:
      # The runner's own stable cargo; a third-party setup action would run before the token step.
      RUSTUP_TOOLCHAIN: stable
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and --provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Outside the checkout: cargo publish refuses a working tree with untracked files.
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/binaries
      - name: Build the packages
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BINARIES: ${{ runner.temp }}/binaries
        run: |
          set -euo pipefail
          node npm/scripts/build-packages.mjs --version "$VERSION" --out "$RUNNER_TEMP/pkgs" \
            --binary aarch64-apple-darwin="$BINARIES/minuta-aarch64-apple-darwin/minuta" \
            --binary x86_64-apple-darwin="$BINARIES/minuta-x86_64-apple-darwin/minuta" \
            --binary x86_64-unknown-linux-musl="$BINARIES/minuta-x86_64-unknown-linux-musl/minuta" \
            --binary aarch64-unknown-linux-musl="$BINARIES/minuta-aarch64-unknown-linux-musl/minuta" \
            > "$RUNNER_TEMP/dirs.txt"
          cat "$RUNNER_TEMP/dirs.txt"
      - name: Publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DRY_RUN: ${{ needs.verify.outputs.dry_run }}
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or newer; an older npm would fail with a misleading auth error.
          npm_version=$(npm --version)
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing requires"
            exit 1
          fi
          mapfile -t dirs < "$RUNNER_TEMP/dirs.txt"
          # Four platform packages and the main package; fewer would publish a launcher that points nowhere.
          if [ "${#dirs[@]}" -ne 5 ]; then
            echo "::error::expected 5 package directories, got ${#dirs[@]}"
            exit 1
          fi
          # Check every package before publishing any, so a bad one cannot leave a partial release.
          for dir in "${dirs[@]}"; do
            name=$(node -p 'require(process.argv[1]).name' "$dir/package.json")
            # The file a user runs must be there and executable, also in a dry run.
            bin=bin/minuta
            if [ "$name" = "@jcioriente/minuta" ]; then bin=bin/minuta.js; fi
            if [ ! -x "$dir/$bin" ]; then
              echo "::error::$name has no executable $bin"
              exit 1
            fi
          done
          for dir in "${dirs[@]}"; do
            name=$(node -p 'require(process.argv[1]).name' "$dir/package.json")
            # Re-running after a partial publish skips what is already on the registry.
            err=$(mktemp)
            if found=$(npm view "$name@$VERSION" version 2> "$err"); then
              if [ "$found" != "$VERSION" ]; then
                echo "::error::npm view $name@$VERSION returned '$found'"
                exit 1
              fi
              echo "$name@$VERSION is already published, skipping"
              continue
            fi
            if ! grep -q 'E404' "$err"; then
              cat "$err"
              echo "::error::could not check whether $name@$VERSION is published"
              exit 1
            fi
            if [ "$DRY_RUN" = true ]; then
              npm publish "$dir" --access public --dry-run
            else
              npm publish "$dir" --access public --provenance
            fi
          done
      - name: Check the crate
        id: crate
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DRY_RUN: ${{ needs.verify.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            # A dry run needs no token. An already published version only warns here.
            cargo publish --dry-run --locked
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Re-running after a partial release skips a crate version crates.io already has.
          status=0
          scripts/crate-published.sh minuta "$VERSION" || status=$?
          case "$status" in
            0) echo "minuta $VERSION is already on crates.io, skipping"
               echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not check whether minuta $VERSION is on crates.io"
               exit 1 ;;
          esac
      # The token is in this step's environment only; cargo reads it and nothing prints it.
      - name: Publish the crate
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # A separate job so only this one holds contents: write and the publish job (with the registry
  # token and id-token) does not. It has no environment, so it adds no second approval; it runs
  # only after `publish` (approved, on a tag on main) succeeded, never on a dry run.
  release:
    needs: [verify, publish]
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Re-running after a partial release skips a release that already exists.
          err=$(mktemp)
          if gh release view "v$VERSION" --json tagName --jq .tagName > /dev/null 2> "$err"; then
            echo "release v$VERSION already exists, skipping"
            exit 0
          fi
          if ! grep -q 'release not found' "$err"; then
            cat "$err"
            echo "::error::could not check whether release v$VERSION exists"
            exit 1
          fi
          # Fails if the CHANGELOG.md section is missing or empty, before anything is created.
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
