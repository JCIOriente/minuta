[package]
name = "minuta"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Turn meeting recordings into transcripts and minutes"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"
sha2 = "0.10"
thiserror = "1"
indicatif = "0.17"
ctrlc = "3"
directories = "5"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
