[package]
name = "minuta"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
description = "Turn meeting recordings into transcripts and minutes"
license = "Apache-2.0"
repository = "https://github.com/JCIOriente/minuta"
homepage = "https://github.com/JCIOriente/minuta"
readme = "README.md"
keywords = ["transcription", "whisper", "meetings", "llm", "subtitles"]
categories = ["command-line-utilities", "multimedia::audio"]
# Development-only material that users of the crate do not need.
exclude = [".baton/", ".github/", ".claude/", "docs/", "CONTEXT.md", "Makefile", "rust-toolchain.toml"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"
sha2 = "0.10"
thiserror = "1"
indicatif = "0.17"
# `termination`: SIGTERM and SIGHUP too, so `kill`, `timeout` or a closed terminal also stop
# the tool, which runs in its own process group and would outlive minuta otherwise.
ctrlc = { version = "3", features = ["termination"] }
directories = "5"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
# kill(2) on a process group, which std cannot do; already in the tree through ctrlc.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
